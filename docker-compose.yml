version: '3.8'

services:
  social-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: social-downloader-api
    ports:
      - "3005:3005"
    environment:
      # Server configuration
      - PORT=3005
      - ENV=production
      - COOKIES_DIR=/app/cookies
      
      # CORS configuration
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
      
      # Chrome configuration
      - CHROME_BIN=/usr/bin/google-chrome
      - CHROME_PATH=/usr/bin/google-chrome
    
    volumes:
      # Mount cookies directory (you need to create this)
      - ./cookies:/app/cookies:ro
      
      # Optional: mount logs directory
      # - ./logs:/app/logs
    
    # Security options
    security_opt:
      - seccomp:unconfined  # Required for Chrome sandbox
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Optional: Add network for multiple services
networks:
  default:
    name: social-downloader-network
